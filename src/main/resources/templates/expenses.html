<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Expenses')}"></head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/base :: header}"></div>
    
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-content">
                    <div class="page-title-section">
                        <h1 class="page-title">
                            <i class="fas fa-list"></i>
                            All Expenses
                        </h1>
                        <p class="page-subtitle">Manage and track all your expenses</p>
                    </div>
                    <div class="page-actions">
                        <a href="/add-expense" class="btn btn-primary">
                            <i class="fas fa-plus"></i>
                            Add Expense
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Filters and Search -->
            <div class="filters-section">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-filter"></i>
                            Filter Expenses
                        </h3>
                        <div class="card-actions">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">
                                <i class="fas fa-times"></i>
                                Clear All
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Quick Filter Buttons -->
                        <div class="quick-filters">
                            <label class="filter-label">Quick Filters:</label>
                            <div class="quick-filter-buttons">
                                <button type="button" class="btn btn-sm btn-outline-primary quick-filter-btn" data-filter="week">
                                    <i class="fas fa-calendar-week"></i>
                                    This Week
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-primary quick-filter-btn" data-filter="month">
                                    <i class="fas fa-calendar-alt"></i>
                                    This Month
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-primary quick-filter-btn" data-filter="30days">
                                    <i class="fas fa-calendar-day"></i>
                                    Last 30 Days
                                </button>
                            </div>
                        </div>

                        <form id="filterForm" class="filters-form">
                            <div class="filter-row">
                                <!-- Search Input -->
                                <div class="filter-group">
                                    <label for="searchText">
                                        <i class="fas fa-search"></i>
                                        Search
                                    </label>
                                    <input type="text" id="searchText" name="search" placeholder="Search by description, category, or amount..." class="form-control">
                                </div>

                                <!-- Category Filter -->
                                <div class="filter-group">
                                    <label for="categoryFilter">
                                        <i class="fas fa-tag"></i>
                                        Category
                                    </label>
                                    <select id="categoryFilter" name="category" class="form-control">
                                        <option value="">All Categories</option>
                                        <option value="FOOD">🍕 Food</option>
                                        <option value="TRANSPORTATION">🚗 Transportation</option>
                                        <option value="ENTERTAINMENT">🎬 Entertainment</option>
                                        <option value="UTILITIES">💡 Utilities</option>
                                        <option value="HEALTHCARE">🏥 Healthcare</option>
                                        <option value="SHOPPING">🛍️ Shopping</option>
                                        <option value="EDUCATION">📚 Education</option>
                                        <option value="OTHER">📝 Other</option>
                                    </select>
                                </div>

                                <!-- Date Range Filters -->
                                <div class="filter-group">
                                    <label for="dateFrom">
                                        <i class="fas fa-calendar-plus"></i>
                                        From Date
                                    </label>
                                    <input type="date" id="dateFrom" name="dateFrom" class="form-control">
                                </div>

                                <div class="filter-group">
                                    <label for="dateTo">
                                        <i class="fas fa-calendar-minus"></i>
                                        To Date
                                    </label>
                                    <input type="date" id="dateTo" name="dateTo" class="form-control">
                                </div>

                                <!-- Amount Range Filters -->
                                <div class="filter-group">
                                    <label for="minAmount">
                                        <i class="fas fa-dollar-sign"></i>
                                        Min Amount
                                    </label>
                                    <input type="number" id="minAmount" name="minAmount" placeholder="0.00" step="0.01" min="0" class="form-control">
                                </div>

                                <div class="filter-group">
                                    <label for="maxAmount">
                                        <i class="fas fa-dollar-sign"></i>
                                        Max Amount
                                    </label>
                                    <input type="number" id="maxAmount" name="maxAmount" placeholder="0.00" step="0.01" min="0" class="form-control">
                                </div>

                                <!-- Filter Actions -->
                                <div class="filter-actions">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-search"></i>
                                        Apply Filters
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Expenses Section -->
            <div class="expenses-section">
                <div class="filter-summary">
                    <div id="filterSummary" class="filter-summary-text">Loading expenses...</div>
                    <div class="filter-summary-actions">
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="expenseManager.loadExpenses()">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                </div>

                <div id="loadingExpenses" class="loading-state" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading expenses...</div>
                </div>

                <div id="expensesContainer"></div>
                <div id="paginationContainer" class="pagination-container" style="display: none;"></div>
            </div>
        </div>
    </main>

    <!-- Styles -->
    <div th:replace="~{fragments/cards :: card-styles}"></div>

    <!-- Script -->
    <script th:src="@{/js/expense.js}"></script>
    <script>
        // ✅ Keep these helpers only
        function clearFilters() {
            if (window.expenseManager) {
                window.expenseManager.clearFilters();
            }
        }

        function changePage(page) {
            if (window.expenseManager) {
                window.expenseManager.loadExpenses(page);
            }
        }
    </script>
</body>
</html>
