<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head}"></head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join us to start tracking your expenses efficiently</p>
            </div>
            
            <!-- Premium Registration Form -->
            <form id="registerForm">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <div class="input-group">
                        <input type="text" 
                               id="username" 
                               name="username" 
                               class="form-control" 
                               placeholder="Choose a unique username"
                               required
                               autocomplete="username">
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                </div>
                
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <div class="input-group">
                        <input type="email" 
                               id="email" 
                               name="email" 
                               class="form-control" 
                               placeholder="Enter your email address"
                               required
                               autocomplete="email">
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-group">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-control" 
                               placeholder="Create a strong password"
                               required
                               autocomplete="new-password">
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Password strength</div>
                    </div>
                </div>
                
                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        <i class="fas fa-lock"></i>
                        Confirm Password
                    </label>
                    <div class="input-group">
                        <input type="password" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               class="form-control" 
                               placeholder="Confirm your password"
                               required
                               autocomplete="new-password">
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye" id="confirmPasswordToggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-match" id="passwordMatch">
                        <i class="fas fa-check-circle"></i>
                        <span>Passwords match</span>
                    </div>
                </div>
                
                <!-- Terms and Conditions -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
                        <span class="checkmark"></span>
                        <span class="checkbox-text">I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a></span>
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                        Creating Account...
                    </span>
                </button>
            </form>
            
            <!-- Auth Footer -->
            <div class="auth-footer">
                <p>Already have an account? 
                    <a href="/login" class="auth-link">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Premium Styles for Register -->
    <style>
        .auth-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, 
                var(--royal-blue-600), 
                var(--royal-gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-lg);
            box-shadow: 
                0 8px 32px rgba(30, 58, 138, 0.3),
                0 4px 16px rgba(30, 58, 138, 0.2);
            animation: iconFloat 3s ease-in-out infinite;
        }
        
        .auth-icon i {
            font-size: var(--font-size-3xl);
            color: white;
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
            font-weight: 600;
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-label i {
            color: var(--royal-blue-400);
            width: 16px;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-group .form-control {
            padding-right: 60px;
            padding-left: 50px;
            height: 56px;
            font-size: var(--font-size-lg);
            border-radius: var(--border-radius-lg);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(59, 130, 246, 0.3);
            transition: var(--transition);
        }
        
        .input-group .form-control:focus {
            border-color: var(--royal-blue-500);
            box-shadow: 
                0 0 0 4px rgba(59, 130, 246, 0.2),
                0 8px 24px rgba(30, 58, 138, 0.15);
            background: rgba(15, 23, 42, 0.95);
        }
        
        .input-icon {
            position: absolute;
            left: 18px;
            color: var(--royal-blue-400);
            font-size: var(--font-size-lg);
            z-index: 2;
            transition: var(--transition);
        }
        
        .input-group .form-control:focus + .input-icon {
            color: var(--royal-blue-300);
            transform: scale(1.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 18px;
            background: none;
            border: none;
            color: var(--royal-blue-400);
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
            z-index: 2;
        }
        
        .password-toggle:hover {
            color: var(--royal-blue-300);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .password-strength {
            margin-top: var(--spacing-sm);
            opacity: 0;
            transition: var(--transition);
        }
        
        .password-strength.show {
            opacity: 1;
        }
        
        .strength-bar {
            height: 4px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: var(--spacing-xs);
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-fill.weak {
            background: var(--danger);
            width: 25%;
        }
        
        .strength-fill.fair {
            background: var(--warning);
            width: 50%;
        }
        
        .strength-fill.good {
            background: var(--info);
            width: 75%;
        }
        
        .strength-fill.strong {
            background: var(--success);
            width: 100%;
        }
        
        .strength-text {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .password-match {
            margin-top: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-xs);
            color: var(--success);
            opacity: 0;
            transition: var(--transition);
        }
        
        .password-match.show {
            opacity: 1;
        }
        
        .password-match.error {
            color: var(--danger);
        }
        
        .password-match.error i {
            transform: rotate(45deg);
        }
        
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            user-select: none;
            padding: var(--spacing-sm);
            border-radius: var(--border-radius-md);
            transition: var(--transition);
            line-height: 1.5;
        }
        
        .checkbox-label:hover {
            background: rgba(59, 130, 246, 0.05);
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--royal-blue-500);
            cursor: pointer;
            border-radius: var(--border-radius-sm);
            margin-top: 2px;
        }
        
        .checkbox-text {
            font-weight: 500;
        }
        
        .terms-link {
            color: var(--royal-blue-400);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .terms-link:hover {
            color: var(--royal-gold);
            text-shadow: 0 2px 4px rgba(251, 191, 36, 0.3);
        }
        
        .btn {
            height: 56px;
            font-size: var(--font-size-lg);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: var(--border-radius-lg);
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        
        .btn-loading {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: var(--spacing-xl) var(--spacing-lg);
                margin: var(--spacing-sm);
            }
            
            .auth-title {
                font-size: var(--font-size-3xl);
            }
            
            .auth-icon {
                width: 60px;
                height: 60px;
            }
            
            .auth-icon i {
                font-size: var(--font-size-2xl);
            }
            
            .input-group .form-control {
                height: 50px;
                font-size: var(--font-size-base);
            }
            
            .btn {
                height: 50px;
                font-size: var(--font-size-base);
            }
        }
    </style>
    
    <!-- JavaScript -->
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script>
        // Initialize register page
        document.addEventListener('DOMContentLoaded', function() {
            // AuthManager is initialized by /js/auth.js; this page script handles UI-only behaviors
            
            // Focus on username field with animation
            setTimeout(() => {
                const usernameField = document.getElementById('username');
                if (usernameField) {
                    usernameField.focus();
                    usernameField.style.transform = 'scale(1.02)';
                    setTimeout(() => {
                        usernameField.style.transform = 'scale(1)';
                    }, 200);
                }
            }, 300);
            
            // Password strength checker
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPassword');
            const strengthBar = document.getElementById('passwordStrength');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            const passwordMatch = document.getElementById('passwordMatch');
            
            passwordField.addEventListener('input', function() {
                const password = this.value;
                if (password.length > 0) {
                    strengthBar.classList.add('show');
                    checkPasswordStrength(password);
                } else {
                    strengthBar.classList.remove('show');
                }
            });
            
            confirmPasswordField.addEventListener('input', function() {
                const password = passwordField.value;
                const confirmPassword = this.value;
                
                if (confirmPassword.length > 0) {
                    passwordMatch.classList.add('show');
                    if (password === confirmPassword) {
                        passwordMatch.classList.remove('error');
                        passwordMatch.innerHTML = '<i class="fas fa-check-circle"></i><span>Passwords match</span>';
                    } else {
                        passwordMatch.classList.add('error');
                        passwordMatch.innerHTML = '<i class="fas fa-times-circle"></i><span>Passwords do not match</span>';
                    }
                } else {
                    passwordMatch.classList.remove('show');
                }
            });
            
            function checkPasswordStrength(password) {
                let score = 0;
                let feedback = '';
                
                // Length check
                if (password.length >= 8) score++;
                else feedback += 'At least 8 characters. ';
                
                // Lowercase check
                if (/[a-z]/.test(password)) score++;
                else feedback += 'Lowercase letters. ';
                
                // Uppercase check
                if (/[A-Z]/.test(password)) score++;
                else feedback += 'Uppercase letters. ';
                
                // Number check
                if (/[0-9]/.test(password)) score++;
                else feedback += 'Numbers. ';
                
                // Special character check
                if (/[^A-Za-z0-9]/.test(password)) score++;
                else feedback += 'Special characters. ';
                
                // Update strength indicator
                strengthFill.className = 'strength-fill';
                if (score <= 2) {
                    strengthFill.classList.add('weak');
                    strengthText.textContent = 'Weak password';
                } else if (score === 3) {
                    strengthFill.classList.add('fair');
                    strengthText.textContent = 'Fair password';
                } else if (score === 4) {
                    strengthFill.classList.add('good');
                    strengthText.textContent = 'Good password';
                } else {
                    strengthFill.classList.add('strong');
                    strengthText.textContent = 'Strong password';
                }
            }
            
            // Add enter key handler
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const submitBtn = document.getElementById('submitBtn');
                    if (submitBtn && !submitBtn.disabled) {
                        submitBtn.click();
                    }
                }
            });
            
            // Add input animations
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'translateY(-2px)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'translateY(0)';
                });
            });
        });
        
        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const toggleIcon = document.getElementById(fieldId + 'ToggleIcon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
