<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/base :: head(title='Add Expense')}">
        <!-- Flatpickr for date/time picker -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    </head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/base :: header}"></div>
    
    <main class="main-content">
        <div class="container">
            <!-- Premium Page Header -->
            <div class="page-header">
                        <h1 class="page-title">
                            <i class="fas fa-plus"></i>
                    Add Expense
                        </h1>
                <p class="page-subtitle">Record a new expense to track your spending</p>
            </div>
            
            <!-- Premium Form Layout -->
            <div class="form-layout">
                <!-- Main Form Card -->
                <div class="form-card">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="fas fa-edit"></i>
                                Expense Details
                            </h3>
                        </div>
                        <div class="card-body">
                            <!-- Premium Expense Form -->
                                <form id="expenseForm" onsubmit="handleSubmit(event)">
                                <!-- Hidden id for edit mode -->
                                <input type="hidden" id="expenseId" name="id" th:if="${expense != null}" th:value="${expense != null ? expense.id : ''}" />
                                <!-- Description Field -->
                                <div class="form-group">
                                    <label for="description" class="form-label">
                                        <i class="fas fa-comment"></i>
                                        Description
                                    </label>
                                    <div class="input-group">
                         <input type="text" 
                             id="description" 
                             name="description" 
                             class="form-control" 
                             placeholder="What did you spend on?"
                             th:value="${expense != null ? expense.description : ''}"
                             required
                             autocomplete="off">
                                        <div class="input-icon">
                                            <i class="fas fa-comment"></i>
                                        </div>
                                    </div>
                                    <div class="form-help">
                                        <i class="fas fa-lightbulb"></i>
                                        Be specific to help with categorization
                                    </div>
                                </div>
                                
                                <!-- Amount Field -->
                                <div class="form-group">
                                    <label for="amount" class="form-label">
                                        <i class="fas fa-dollar-sign"></i>
                                        Amount
                                    </label>
                                    <div class="input-group">
                                        <span class="currency-symbol">$</span>
                         <input type="number" 
                             id="amount" 
                             name="amount" 
                             class="form-control" 
                             placeholder="0.00"
                             th:value="${expense != null ? expense.amount : ''}"
                             step="0.01"
                             min="0"
                             required
                             autocomplete="off">
                                        <div class="input-icon">
                                            <i class="fas fa-dollar-sign"></i>
                                        </div>
                                    </div>
                                    <div class="form-help">
                                        <i class="fas fa-info-circle"></i>
                                        Enter the amount spent
                                    </div>
                                </div>
                                
                                <!-- Quick Amount Buttons -->
                                <div class="quick-amounts">
                                    <label class="quick-amounts-label">
                                        <i class="fas fa-bolt"></i>
                                        Quick Amounts
                                    </label>
                                    <div class="quick-amount-buttons">
                                        <button type="button" class="quick-amount-btn" data-amount="5">$5</button>
                                        <button type="button" class="quick-amount-btn" data-amount="10">$10</button>
                                        <button type="button" class="quick-amount-btn" data-amount="25">$25</button>
                                        <button type="button" class="quick-amount-btn" data-amount="50">$50</button>
                                        <button type="button" class="quick-amount-btn" data-amount="100">$100</button>
                                    </div>
                                </div>
                                
                                <!-- Category Field -->
                                <div class="form-group">
                                    <label for="category" class="form-label">
                                        <i class="fas fa-tags"></i>
                                        Category
                                    </label>
                                    <div class="input-group">
                                        <select id="category" name="category" class="form-select" required>
                                            <option value="">Select a category</option>
                                            <option value="FOOD" th:selected="${expense != null and expense.category == 'FOOD'}">Food</option>
                                            <option value="TRANSPORTATION" th:selected="${expense != null and expense.category == 'TRANSPORTATION'}">Transportation</option>
                                            <option value="UTILITIES" th:selected="${expense != null and expense.category == 'UTILITIES'}">Utilities</option>
                                            <option value="ENTERTAINMENT" th:selected="${expense != null and expense.category == 'ENTERTAINMENT'}">Entertainment</option>
                                            <option value="HEALTHCARE" th:selected="${expense != null and expense.category == 'HEALTHCARE'}">Healthcare</option>
                                            <option value="OTHER" th:selected="${expense != null and expense.category == 'OTHER'}">Other</option>
                                        </select>
                                        <div class="input-icon">
                                            <i class="fas fa-tags"></i>
                                        </div>
                                    </div>
                                    <div class="form-help">
                                        <i class="fas fa-filter"></i>
                                        Choose the most appropriate category
                                </div>
                            </div>
                            
                                <!-- Date Field -->
                                <div class="form-group">
                                    <label for="createdAt" class="form-label">
                                        <i class="fas fa-calendar"></i>
                                        Date
                                    </label>
                                    <div class="input-group">
                         <input type="text" 
                             id="createdAt" 
                             name="createdAt" 
                             class="form-control" 
                             placeholder="YYYY-MM-DDTHH:mm:ss"
                             th:value="${expense != null ? #temporals.format(expense.createdAt, 'yyyy-MM-dd''T''HH:mm:ss') : ''}"
                             required>
                                        <div class="input-icon">
                                            <i class="fas fa-calendar"></i>
                                </div>
                                    </div>
                                    <div class="form-help">
                                        <i class="fas fa-clock"></i>
                                        When did this expense occur?
                            </div>
                        </div>
                        
                        <!-- Form Actions -->
                        <div class="form-actions">
                                    <button type="button" class="btn btn-secondary" onclick="goBack()">
                                        <i class="fas fa-arrow-left"></i>
                                        Cancel
                                    </button>
                                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">
                                        <span class="btn-text">
                                            <i class="fas fa-save"></i>
                                            Save Expense
                                        </span>
                                        <span class="btn-loading" style="display: none;">
                                            <i class="fas fa-spinner fa-spin"></i>
                                            Saving...
                                        </span>
                                </button>
                            </div>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Preview Card -->
                <div class="preview-card">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="fas fa-eye"></i>
                                Live Preview
                            </h3>
                        </div>
                        <div class="card-body">
                            <div id="expensePreview" class="expense-preview">
                                <div class="preview-placeholder">
                                    <div class="preview-icon">
                                        <i class="fas fa-receipt"></i>
                                </div>
                                    <div class="preview-text">
                                        <h4>Expense Preview</h4>
                                        <p>Fill in the form to see a live preview of your expense</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Premium Styles for Add Expense Page -->

        .quick-amounts-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
            font-weight: 600;
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .quick-amounts-label i {

                font-size: var(--font-size-2xl);
            }

    </style>
    
    <!-- JavaScript -->
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script>

        function ensureFlatpickrLoaded() {
            // Load CSS if missing
            if (!document.querySelector('link[href*="flatpickr"]')) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css';
                document.head.appendChild(link);
            }

            // If already available, resolve immediately
            if (typeof flatpickr === 'function') {
                return Promise.resolve();
            }
            return new Promise((resolve, reject) => {
                // Avoid adding duplicate script tags
                if (document.querySelector('script[src="https://cdn.jsdelivr.net/npm/flatpickr"]')) {
                    // Wait briefly for the script to initialize
                    const waitStart = Date.now();
                    const interval = setInterval(() => {
                        if (typeof flatpickr === 'function') {
                            clearInterval(interval);
                            resolve();
                        } else if (Date.now() - waitStart > 5000) {
                            clearInterval(interval);
                            reject(new Error('flatpickr did not initialize in time'));
                        }
                    }, 50);
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/flatpickr';
                s.async = true;
                s.onload = () => {
                    // small delay to ensure lib is available
                    setTimeout(() => {
                        if (typeof flatpickr === 'function') resolve();
                        else reject(new Error('flatpickr loaded but not available'));
                    }, 10);
                };
                s.onerror = () => reject(new Error('Failed to load flatpickr script'));
                document.head.appendChild(s);
            });
        }

            
        // Initialize add expense page when DOM loads
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Flatpickr for date/time picker
            const createdAtInput = document.getElementById('createdAt');
            if (createdAtInput) {
                ensureFlatpickrLoaded()
                    .then(() => {
                        try {
                            flatpickr(createdAtInput, {
                                enableTime: true,
                                // use ISO-like format that matches backend expectation
                                dateFormat: "Y-m-d\\TH:i:S",
                                time_24hr: true,
                                allowInput: false,
                                defaultDate: createdAtInput.value && createdAtInput.value.length ? createdAtInput.value : new Date(),
                                minDate: "2020-01-01",
                                maxDate: "2030-12-31"
                            });
                        } catch (e) {
                            console.error('flatpickr init error:', e);
                        }
                    })
                    .catch(err => {
                        console.error('Could not load flatpickr:', err);
                        // Fallback: allow manual typing but warn user
                        createdAtInput.removeAttribute('readonly');
                    });
            }
            
            // Add entrance animations
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 150);
            });
            
            // Initialize form interactions
            initializeFormInteractions();
        });
        
        function initializeFormInteractions() {
                const form = document.getElementById('expenseForm');
            const descriptionInput = document.getElementById('description');
            const amountInput = document.getElementById('amount');
            const categorySelect = document.getElementById('category');
            const dateInput = document.getElementById('createdAt');
            const quickAmountBtns = document.querySelectorAll('.quick-amount-btn');
            
            // Quick amount buttons
            quickAmountBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const amount = this.dataset.amount;
                    if (amountInput) amountInput.value = amount;

                    // Update active state
                    quickAmountBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // Update preview
                    updatePreview();
                });
            });

            // Form inputs for live preview (guard nulls)
            [descriptionInput, amountInput, categorySelect, dateInput].forEach(input => {
                if (!input) return;
                input.addEventListener('input', updatePreview);
                input.addEventListener('change', updatePreview);
            });

            // Amount input formatting
            if (amountInput) {
                amountInput.addEventListener('input', function() {
                    // Remove active state from quick amount buttons when manually typing
                    quickAmountBtns.forEach(btn => btn.classList.remove('active'));
                });
            }
        }
        
        function updatePreview() {
            const descEl = document.getElementById('description');
            const amtEl = document.getElementById('amount');
            const catEl = document.getElementById('category');
            const dateEl = document.getElementById('createdAt');

            const description = descEl ? descEl.value : '';
            const amount = amtEl ? amtEl.value : '';
            const category = catEl ? catEl.value : '';
            const date = dateEl ? dateEl.value : '';

            const previewContainer = document.getElementById('expensePreview');
            if (!previewContainer) return;

            if (description || amount || category || date) {
                const categoryText = getCategoryText(category);
                const formattedDate = formatDate(date);
                const parsedAmount = parseFloat(amount);
                const formattedAmount = !isNaN(parsedAmount) ? `$${parsedAmount.toFixed(2)}` : '$0.00';

                previewContainer.innerHTML = `
                    <div class="preview-expense">
                        <div class="preview-header">
                            <div class="preview-category">
                                <i class="fas fa-tag"></i>
                                ${categoryText || 'Category'}
                            </div>
                            <div class="preview-amount">${formattedAmount}</div>
                        </div>
                        <div class="preview-description">${description || 'Description'}</div>
                        <div class="preview-date">
                            <i class="fas fa-calendar"></i>
                            ${formattedDate || 'Date'}
                        </div>
                    </div>
                `;
            } else {
                previewContainer.innerHTML = `
                    <div class="preview-placeholder">
                        <div class="preview-icon">
                            <i class="fas fa-receipt"></i>
                        </div>
                        <div class="preview-text">
                            <h4>Expense Preview</h4>
                            <p>Fill in the form to see a live preview of your expense</p>
                        </div>
                    </div>
                `;
            }
        }
        
        function getCategoryText(category) {
            const categories = {
                'FOOD': 'Food',
                'TRANSPORTATION': 'Transportation',
                'UTILITIES': 'Utilities',
                'ENTERTAINMENT': 'Entertainment',
                'HEALTHCARE': 'Healthcare',
                'OTHER': 'Other'
            };
            return categories[category] || '';
        }
        
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function handleSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoading = submitBtn.querySelector('.btn-loading');
            
            // Show loading state
            btnText.style.display = 'none';
            btnLoading.style.display = 'flex';
            submitBtn.disabled = true;
            
            // Get form data
            const formData = new FormData(event.target);
            const expenseData = {
                description: formData.get('description'),
                amount: parseFloat(formData.get('amount')),
                category: formData.get('category'),
                createdAt: formData.get('createdAt')
            };
            
            // Determine if we're editing an existing expense
            const expenseId = formData.get('id');
            const isEdit = expenseId && expenseId !== '';
            const url = isEdit ? `/api/expense/update/${expenseId}` : '/api/expense/add';
            const method = isEdit ? 'PUT' : 'POST';

            // Submit to backend using central apiFetch (ensures credentials and CSRF if needed)
            (async () => {
                const headers = { 'Content-Type': 'application/json' };
                try {
                    const storedToken = localStorage.getItem('authToken');
                    if (storedToken) headers['Authorization'] = 'Bearer ' + storedToken;
                } catch (e) { /* ignore storage errors */ }

                try {
                    const res = await apiFetch(url, {
                        method: method,
                        headers,
                        body: JSON.stringify(expenseData)
                    });

                    if (!res.ok) {
                        const text = await res.text().catch(() => null);
                        console.error('Add/Update expense failed', { status: res.status, body: text });
                        showAlert('Failed to add expense. Please try again.', 'danger');
                        return;
                    }

                    // Some endpoints return JSON, others plain text. Attempt to parse JSON.
                    let data = null;
                    try { data = await res.json(); } catch (e) { data = null; }

                    showAlert(isEdit ? 'Expense updated successfully!' : 'Expense added successfully!', 'success');
                    event.target.reset();
                    updatePreview();
                    document.querySelectorAll('.quick-amount-btn').forEach(btn => btn.classList.remove('active'));

                    setTimeout(() => { window.location.href = '/expenses'; }, 1200);
                } catch (err) {
                    console.error('Error submitting expense:', err);
                    showAlert('Failed to add expense. Please check your connection and try again.', 'danger');
                } finally {
                    // Reset button state
                    btnText.style.display = 'flex';
                    btnLoading.style.display = 'none';
                    submitBtn.disabled = false;
                }
            })();
        }
        
        function goBack() {
            window.history.back();
        }
        
        function showAlert(message, type) {
            // Use global AlertUtils instead of trying to append to non-existent alertContainer
            if (typeof AlertUtils !== 'undefined') {
                AlertUtils.show(message, type);
            } else {
                console.log(`${type}: ${message}`);
            }
        }
    </script>
</body>
</html>
