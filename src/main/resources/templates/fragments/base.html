<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Expense Tracker' : 'Expense Tracker'}">Expense Tracker</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Additional CSS -->
    <th:block th:fragment="additional-css"></th:block>
</head>
<body>
    <!-- Premium Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- Premium Alert Container -->
    <div id="alertContainer" class="alert-container"></div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Premium Navigation Fragment -->
        <div th:fragment="header" class="main-navigation">
            <nav class="navbar">
                <div class="nav-container">
                    <a href="/dashboard" class="brand-link">
                        <i class="fas fa-wallet brand-icon"></i>
                        <span class="brand-text">Expense Tracker</span>
                    </a>
                    
                    <div class="nav-menu" id="navMenu">
                        <a href="/dashboard" class="nav-link">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                        
                        <a href="/expenses" class="nav-link">
                            <i class="fas fa-list"></i>
                            <span>Expenses</span>
                        </a>
                        
                        <a href="/add-expense" class="nav-link">
                            <i class="fas fa-plus"></i>
                            <span>Add Expense</span>
                        </a>
                        
                        <button type="button" class="nav-link logout-btn" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </button>
                    </div>
                    
                    <div class="nav-toggle" id="navToggle">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <th:block th:fragment="content">
                    <!-- Page content will be inserted here -->
                </th:block>
            </div>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    
    <!-- Additional JavaScript -->
    <th:block th:fragment="additional-js"></th:block>

    <!-- Navigation Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', function() {
                    navMenu.classList.toggle('active');
                    
                    // Animate hamburger bars
                    const bars = navToggle.querySelectorAll('.bar');
                    bars.forEach((bar, index) => {
                        if (navMenu.classList.contains('active')) {
                            if (index === 0) bar.style.transform = 'rotate(45deg) translate(5px, 5px)';
                            if (index === 1) bar.style.opacity = '0';
                            if (index === 2) bar.style.transform = 'rotate(-45deg) translate(7px, -6px)';
                        } else {
                            bar.style.transform = 'none';
                            bar.style.opacity = '1';
                        }
                    });
                });
                
                // Close menu when clicking on links
                const navLinks = navMenu.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        navMenu.classList.remove('active');
                        const bars = navToggle.querySelectorAll('.bar');
                        bars.forEach(bar => {
                            bar.style.transform = 'none';
                            bar.style.opacity = '1';
                        });
                    });
                });
            }
            
            // Set active navigation link based on current page
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
