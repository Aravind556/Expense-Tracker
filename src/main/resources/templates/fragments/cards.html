<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Card Components</title>
</head>
<body>
    <!-- Premium Card Styles Fragment -->
    <div th:fragment="card-styles">
        <style>
            /* Premium Card Components */
            .card {
                background: linear-gradient(145deg, 
                    rgba(255, 255, 255, 0.1), 
                    rgba(30, 58, 138, 0.05));
                backdrop-filter: blur(20px) saturate(180%);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: var(--border-radius-xl);
                padding: var(--spacing-xl);
                margin-bottom: var(--spacing-xl);
                box-shadow: 
                    0 20px 40px rgba(30, 58, 138, 0.1),
                    0 8px 16px rgba(30, 58, 138, 0.05),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                transition: var(--transition);
                position: relative;
                overflow: hidden;
            }
            
            .card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, 
                    transparent, 
                    rgba(255, 255, 255, 0.4), 
                    transparent);
            }
            
            .card:hover {
                transform: translateY(-8px) scale(1.02);
                box-shadow: 
                    0 32px 64px rgba(30, 58, 138, 0.15),
                    0 16px 32px rgba(30, 58, 138, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
            
            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: var(--spacing-lg);
                padding-bottom: var(--spacing-md);
                border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            }
            
            .card-title {
                font-size: var(--font-size-xl);
                color: var(--royal-blue-300);
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
            }
            
            .card-title i {
                color: var(--royal-gold);
            }
            
            .card-body {
                position: relative;
            }
            
            /* Premium Statistics Cards */
            .stat-card {
                background: linear-gradient(145deg, 
                    rgba(30, 58, 138, 0.1), 
                    rgba(37, 99, 235, 0.05));
                backdrop-filter: blur(20px);
                padding: var(--spacing-xl);
                border-radius: var(--border-radius-xl);
                display: flex;
                align-items: center;
                gap: var(--spacing-lg);
                border: 1px solid rgba(59, 130, 246, 0.2);
                transition: var(--transition);
                box-shadow: 
                    0 8px 32px rgba(30, 58, 138, 0.1),
                    0 4px 16px rgba(30, 58, 138, 0.05);
                position: relative;
                overflow: hidden;
            }
            
            .stat-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: linear-gradient(180deg, 
                    var(--royal-blue-500), 
                    var(--royal-gold));
            }

            /* Small vertical label shown in the left accent area to clarify card purpose */
            .stat-side-label {
                position: absolute;
                left: 8px; /* sit inside the left accent area */
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-secondary);
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.5px;
                writing-mode: vertical-rl;
                text-orientation: mixed;
                opacity: 0.95;
                pointer-events: none;
            }
            
            .stat-card:hover {
                transform: translateY(-8px) scale(1.05);
                box-shadow: 
                    0 20px 40px rgba(30, 58, 138, 0.2),
                    0 8px 24px rgba(30, 58, 138, 0.1);
            }
            
            .stat-icon {
                font-size: var(--font-size-4xl);
                color: var(--royal-blue-400);
                opacity: 0.9;
                text-shadow: 0 2px 4px rgba(30, 58, 138, 0.3);
            }
            
            .stat-content {
                flex: 1;
            }
            
            .stat-value {
                font-size: var(--font-size-3xl);
                font-weight: 700;
                color: var(--royal-blue-300);
                margin-bottom: var(--spacing-xs);
                text-shadow: 0 2px 4px rgba(30, 58, 138, 0.3);
            }
            .stat-heading {
                font-size: var(--font-size-sm);
                color: var(--text-secondary);
                font-weight: 700;
                text-transform: uppercase;
                margin-bottom: 6px;
                letter-spacing: 0.6px;
            }
            
            .stat-label {
                color: var(--text-secondary);
                font-size: var(--font-size-sm);
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 500;
            }
            
            .stat-trend {
                display: flex;
                align-items: center;
                gap: var(--spacing-xs);
                font-size: var(--font-size-xs);
                font-weight: 600;
                margin-top: var(--spacing-xs);
            }
            
            .stat-trend.positive {
                color: var(--success);
            }
            
            .stat-trend.negative {
                color: var(--danger);
            }
            
            /* Premium Expense Cards */
            .expense-card {
                background: linear-gradient(145deg, 
                    rgba(255, 255, 255, 0.05), 
                    rgba(30, 58, 138, 0.02));
                backdrop-filter: blur(20px);
                border: 1px solid rgba(59, 130, 246, 0.2);
                border-radius: var(--border-radius-xl);
                padding: var(--spacing-xl);
                transition: var(--transition);
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }
            
            .expense-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: linear-gradient(180deg, 
                    var(--royal-blue-500), 
                    var(--royal-gold));
                opacity: 0;
                transition: var(--transition);
            }
            
            .expense-card:hover {
                transform: translateY(-8px) scale(1.02);
                box-shadow: 
                    0 20px 40px rgba(30, 58, 138, 0.15),
                    0 8px 16px rgba(30, 58, 138, 0.1);
                border-color: var(--royal-blue-400);
            }
            
            .expense-card:hover::before {
                opacity: 1;
            }
            
            .expense-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: var(--spacing-md);
            }
            
            .expense-category {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                padding: var(--spacing-xs) var(--spacing-sm);
                background: rgba(59, 130, 246, 0.1);
                border-radius: var(--border-radius-sm);
                font-size: var(--font-size-xs);
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--royal-blue-300);
            }
            
            .expense-amount {
                font-size: var(--font-size-2xl);
                font-weight: 700;
                color: var(--royal-blue-400);
                text-shadow: 0 2px 4px rgba(30, 58, 138, 0.3);
            }
            
            .expense-description {
                font-size: var(--font-size-lg);
                font-weight: 600;
                color: var(--text-primary);
                margin-bottom: var(--spacing-sm);
                line-height: 1.4;
            }
            
            .expense-date {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                color: var(--text-secondary);
                font-size: var(--font-size-sm);
            }
            
            .expense-actions {
                display: flex;
                gap: var(--spacing-sm);
                margin-top: var(--spacing-md);
                opacity: 0;
                transition: var(--transition);
            }
            
            .expense-card:hover .expense-actions {
                opacity: 1;
            }
            
            .expense-action-btn {
                padding: var(--spacing-sm) var(--spacing-md);
                border: none;
                border-radius: var(--border-radius-sm);
                font-size: var(--font-size-sm);
                font-weight: 500;
                cursor: pointer;
                transition: var(--transition);
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: var(--spacing-xs);
            }
            
            .expense-action-btn.edit {
                background: rgba(6, 182, 212, 0.1);
                color: var(--info);
                border: 1px solid rgba(6, 182, 212, 0.3);
            }
            
            .expense-action-btn.edit:hover {
                background: rgba(6, 182, 212, 0.2);
                transform: translateY(-2px);
            }
            
            .expense-action-btn.delete {
                background: rgba(239, 68, 68, 0.1);
                color: var(--danger);
                border: 1px solid rgba(239, 68, 68, 0.3);
            }
            
            .expense-action-btn.delete:hover {
                background: rgba(239, 68, 68, 0.2);
                transform: translateY(-2px);
            }
            
            /* Premium Chart Cards */
            .chart-card {
                background: linear-gradient(145deg, 
                    rgba(255, 255, 255, 0.05), 
                    rgba(30, 58, 138, 0.02));
                backdrop-filter: blur(20px);
                border: 1px solid rgba(59, 130, 246, 0.2);
                border-radius: var(--border-radius-xl);
                padding: var(--spacing-xl);
                transition: var(--transition);
                position: relative;
                overflow: hidden;
            }
            
            .chart-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, 
                    transparent, 
                    rgba(255, 255, 255, 0.4), 
                    transparent);
            }
            
            .chart-card:hover {
                transform: translateY(-4px);
                box-shadow: 
                    0 16px 32px rgba(30, 58, 138, 0.15),
                    0 8px 16px rgba(30, 58, 138, 0.1);
            }
            
            .chart-container {
                min-height: 200px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            
            .chart-placeholder {
                text-align: center;
                color: var(--text-secondary);
            }
            
            .chart-placeholder-icon {
                width: 60px;
                height: 60px;
                background: linear-gradient(135deg, 
                    var(--royal-blue-600), 
                    var(--royal-gold));
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto var(--spacing-md);
                box-shadow: 
                    0 8px 16px rgba(30, 58, 138, 0.3),
                    0 4px 8px rgba(30, 58, 138, 0.2);
            }
            
            .chart-placeholder-icon i {
                font-size: var(--font-size-xl);
                color: white;
            }
            
            /* Premium Loading States */
            .loading-placeholder {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: var(--spacing-md);
                padding: var(--spacing-xl);
                color: var(--text-secondary);
            }
            
            .loading-spinner-small {
                width: 30px;
                height: 30px;
                border: 3px solid var(--royal-gray-700);
                border-top: 3px solid var(--royal-blue-500);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            
            /* Premium Empty States */
            .empty-state {
                text-align: center;
                padding: var(--spacing-2xl) var(--spacing-xl);
                color: var(--text-secondary);
            }
            
            .empty-icon {
                font-size: var(--font-size-5xl);
                margin-bottom: var(--spacing-lg);
                opacity: 0.6;
                color: var(--royal-blue-400);
            }
            
            .empty-title {
                font-size: var(--font-size-2xl);
                margin-bottom: var(--spacing-md);
                color: var(--text-primary);
                font-weight: 600;
            }
            
            .empty-message {
                font-size: var(--font-size-lg);
                margin-bottom: var(--spacing-xl);
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                line-height: 1.6;
            }
            
            /* Responsive Design for Cards */
            @media (max-width: 768px) {
                .card {
                    padding: var(--spacing-lg);
                }
                
                .stat-card {
                    flex-direction: column;
                    text-align: center;
                    gap: var(--spacing-md);
                    padding: var(--spacing-lg);
                }
                
                .expense-card {
                    padding: var(--spacing-lg);
                }
                
                .expense-amount {
                    font-size: var(--font-size-xl);
                }
                
                .expense-description {
                    font-size: var(--font-size-base);
                }
                
                .chart-card {
                    padding: var(--spacing-lg);
                }
            }
            
            @media (max-width: 480px) {
                .card {
                    padding: var(--spacing-md);
                }
                
                .stat-card {
                    padding: var(--spacing-md);
                }
                
                .expense-card {
                    padding: var(--spacing-md);
                }
                
                .chart-card {
                    padding: var(--spacing-md);
                }
                
                .stat-value {
                    font-size: var(--font-size-2xl);
                }
                
                .expense-amount {
                    font-size: var(--font-size-lg);
                }
            }
        </style>
    </div>
    
    <!-- Premium Form Components Fragment -->
    <div th:fragment="form-styles">
        <style>
            /* Premium Form Components */
            .form-group {
                margin-bottom: var(--spacing-lg);
                position: relative;
            }
            
            .form-label {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                margin-bottom: var(--spacing-sm);
                color: var(--text-primary);
                font-weight: 600;
                font-size: var(--font-size-sm);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            
            .form-label i {
                color: var(--royal-blue-400);
                width: 16px;
            }
            
            .form-control {
                width: 100%;
                padding: var(--spacing-md) var(--spacing-lg);
                border: 2px solid rgba(59, 130, 246, 0.3);
                border-radius: var(--border-radius-md);
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(10px);
                color: var(--text-primary);
                font-size: var(--font-size-base);
                transition: var(--transition);
                position: relative;
            }
            
            .form-control:focus {
                outline: none;
                border-color: var(--royal-blue-500);
                box-shadow: 
                    0 0 0 4px rgba(59, 130, 246, 0.2),
                    0 4px 12px rgba(30, 58, 138, 0.1);
                background: rgba(15, 23, 42, 0.9);
                transform: translateY(-2px);
            }
            
            .form-control::placeholder {
                color: var(--text-muted);
                transition: var(--transition);
            }
            
            .form-control:focus::placeholder {
                color: var(--text-secondary);
            }
            
            .form-select {
                width: 100%;
                padding: var(--spacing-md) var(--spacing-lg);
                border: 2px solid rgba(59, 130, 246, 0.3);
                border-radius: var(--border-radius-md);
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(10px);
                color: var(--text-primary);
                font-size: var(--font-size-base);
                transition: var(--transition);
                appearance: none;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
                background-position: right 12px center;
                background-repeat: no-repeat;
                background-size: 16px;
            }
            
            .form-select:focus {
                outline: none;
                border-color: var(--royal-blue-500);
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            }
            
            .form-help {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                margin-top: var(--spacing-sm);
                color: var(--text-secondary);
                font-size: var(--font-size-sm);
                font-style: italic;
            }
            
            .form-help i {
                color: var(--royal-gold);
            }
            
            .form-error {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                margin-top: var(--spacing-sm);
                color: var(--danger);
                font-size: var(--font-size-sm);
                font-weight: 500;
            }
            
            .form-error i {
                color: var(--danger);
            }
            
            .form-success {
                display: flex;
                align-items: center;
                gap: var(--spacing-sm);
                margin-top: var(--spacing-sm);
                color: var(--success);
                font-size: var(--font-size-sm);
                font-weight: 500;
            }
            
            .form-success i {
                color: var(--success);
            }
        </style>
    </div>
</body>
</html>
